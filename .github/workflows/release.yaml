name: Build

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: "armv7-unknown-linux-musleabihf"
          components: rust-src
      - name: Setup zig
        uses: mlugg/setup-zig@v2
        with:
          # A release, not master: zig master broke the armv7 build ("unknown CPU: 'generic'").
          version: 0.17.1
      - uses: taiki-e/install-action@v2.90.2
        with:
          tool: cargo-zigbuild
      - name: Build
        run: RUSTFLAGS="-Zlocation-detail=none" cargo +nightly zigbuild -Z build-std=std,panic_abort --target armv7-unknown-linux-musleabihf --release
      # Only the asset is replaced: updating the release itself (softprops/action-gh-release)
      # fails with 403 "Resource not accessible by integration".
      - name: Upload to the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload latest target/armv7-unknown-linux-musleabihf/release/espeak-web --clobber -R "$GITHUB_REPOSITORY"
